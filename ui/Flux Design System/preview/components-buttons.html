<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;font-weight:500;font-family:var(--font-ui);border:1px solid transparent;cursor:default;height:36px;padding:0 16px;font-size:14px;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn--default{background:#0f9fb8;color:#fff}
.btn--secondary{background:#e3f7fb;color:#0f9fb8}
.btn--outline{background:#fff;color:#0f172a;border-color:#dde6f2}
.btn--ghost{background:transparent;color:#0f172a}
.btn--destructive{background:#be123c;color:#fff}
.btn--sm{height:32px;padding:0 12px;font-size:12px}
.btn--icon{width:36px;height:36px;padding:0}
</style></head>
<body>
<div class="row" style="gap:10px">
  <button class="btn btn--default">Open Dashboard</button>
  <button class="btn btn--secondary">View latest (3)</button>
  <button class="btn btn--outline">Reset</button>
  <button class="btn btn--ghost">Cancel</button>
  <button class="btn btn--destructive">Archive</button>
</div>
<div class="row" style="gap:10px;margin-top:16px">
  <button class="btn btn--default"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Apply</button>
  <button class="btn btn--outline btn--sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36"/><path d="M3 4v5h5"/></svg>Replay</button>
  <button class="btn btn--outline btn--icon" aria-label="Pause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5v14"/><path d="M15 5v14"/></svg></button>
  <span class="caption" style="margin-left:auto">radius 8 · sm 32px / default 36px · icon 36²</span>
</div>
</body></html>
