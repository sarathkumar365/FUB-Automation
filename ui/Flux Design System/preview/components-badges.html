<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>.bdg{display:inline-flex;align-items:center;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}</style></head>
<body>
<div class="row" style="gap:10px">
  <span class="bdg" style="background:#e3f7fb;color:#0f9fb8">RECEIVED</span>
  <span class="bdg" style="background:#ccfbf1;color:#0f766e">TASK_CREATED</span>
  <span class="bdg" style="background:#fef3c7;color:#b45309">SKIPPED</span>
  <span class="bdg" style="background:#ffe4e6;color:#be123c">FAILED</span>
  <span class="bdg" style="background:#fbfdff;color:#64748b;border:1px solid #dde6f2">PROCESSING</span>
</div>
<p class="caption" style="margin-top:16px">Badge variants: default (info), success, warning, error, muted. Pill radius, 12px / 600. Status text is always literal — uppercase enum values, never abbreviated to a color.</p>
</body></html>
