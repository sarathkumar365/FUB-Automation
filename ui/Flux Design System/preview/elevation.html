<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:#f7f9fc">
<div class="row" style="gap:26px">
  <div class="col" style="gap:10px;align-items:center">
    <div style="width:150px;height:74px;background:#fff;border:1px solid #dde6f2;border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.08)"></div>
    <div class="name" style="font-size:12px">subtle</div><div class="hex" style="text-align:center">0 1px 3px / .08<br>resting card</div>
  </div>
  <div class="col" style="gap:10px;align-items:center">
    <div style="width:150px;height:74px;background:#fff;border:1px solid #dde6f2;border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.08),0 4px 12px rgba(15,23,42,.08)"></div>
    <div class="name" style="font-size:12px">hover</div><div class="hex" style="text-align:center">+ 0 4px 12px<br>lifted tile</div>
  </div>
  <div class="col" style="gap:10px;align-items:center">
    <div style="width:150px;height:74px;background:rgba(255,255,255,.8);backdrop-filter:blur(4px);border:1px solid #dbe7f2;border-radius:14px;box-shadow:0 8px 22px rgba(15,23,42,.04)"></div>
    <div class="name" style="font-size:12px">float · glass</div><div class="hex" style="text-align:center">0 8px 22px / .04<br>milestone card</div>
  </div>
</div>
<p class="caption" style="margin-top:18px">Soft, low-elevation shadows only. No hard drop shadows; lift comes from blur + a -1px translate on hover.</p>
</body></html>
