<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="grid" style="grid-template-columns:repeat(6,1fr);gap:14px">
  <div class="col" style="gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:999px;background:#0f9fb8"></span><div class="name" style="font-size:11px;text-align:center">trigger</div><div class="hex">#0f9fb8</div></div>
  <div class="col" style="gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:999px;background:#6366f1"></span><div class="name" style="font-size:11px;text-align:center">wait</div><div class="hex">#6366f1</div></div>
  <div class="col" style="gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:999px;background:#db2777"></span><div class="name" style="font-size:11px;text-align:center">branch</div><div class="hex">#db2777</div></div>
  <div class="col" style="gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:999px;background:#d97706"></span><div class="name" style="font-size:11px;text-align:center">side-effect</div><div class="hex">#d97706</div></div>
  <div class="col" style="gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:999px;background:#059669"></span><div class="name" style="font-size:11px;text-align:center">compute</div><div class="hex">#059669</div></div>
  <div class="col" style="gap:8px;align-items:center"><span style="width:22px;height:22px;border-radius:999px;background:#64748b"></span><div class="name" style="font-size:11px;text-align:center">neutral</div><div class="hex">#64748b</div></div>
</div>
<p class="caption" style="margin-top:18px">Workflow storyboard node categories. Used as dots, pill fills (≈14% alpha) and node accents on the builder canvas.</p>
</body></html>
