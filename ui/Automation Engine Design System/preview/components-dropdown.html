<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.dd{position:relative;width:200px}
.ddbtn{height:34px;width:100%;border:1px solid #dde6f2;border-radius:8px;background:#fff;padding:0 10px;font:500 13px var(--font-ui);color:#0f172a;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ddbtn.open{box-shadow:0 0 0 2px #fff,0 0 0 4px #0f9fb8}
.chev{width:16px;height:16px;stroke:#64748b;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu{position:absolute;top:calc(100% + 4px);left:0;width:100%;margin:0;padding:4px;list-style:none;background:#fff;border:1px solid #dde6f2;border-radius:8px;box-shadow:0 12px 30px rgba(15,23,42,.16);z-index:2}
.opt{padding:7px 10px;border-radius:6px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#0f172a;font-weight:500}
.opt.on{color:#0f9fb8;font-weight:600;background:#fff}
.opt.hot{background:#fbfdff}
.chk{width:15px;height:15px;stroke:#0f9fb8;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body>
<div class="row" style="gap:40px;align-items:flex-start">
  <div class="col" style="gap:8px">
    <span class="caption">Closed</span>
    <div class="dd"><button class="ddbtn">All event types<svg class="chev" viewBox="0 0 20 20"><polyline points="6 8 10 12 14 8"/></svg></button></div>
  </div>
  <div class="col" style="gap:8px">
    <span class="caption">Open</span>
    <div class="dd">
      <button class="ddbtn open">Calls Created<svg class="chev" viewBox="0 0 20 20" style="transform:rotate(180deg)"><polyline points="6 8 10 12 14 8"/></svg></button>
      <ul class="menu">
        <li class="opt">All event types</li>
        <li class="opt on">Calls Created<svg class="chk" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></li>
        <li class="opt hot">People Created</li>
        <li class="opt">People Updated</li>
      </ul>
    </div>
  </div>
</div>
<p class="caption" style="margin-top:150px">Custom <b>Dropdown</b> replaces native <code style="font-family:var(--font-mono)">&lt;select&gt;</code> across filters &amp; settings — brand focus ring, rotating chevron, brand-checked selection, full keyboard nav.</p>
</body></html>
