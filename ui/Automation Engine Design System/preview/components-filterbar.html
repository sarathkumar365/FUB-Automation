<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.bar{border:1px solid #dde6f2;border-radius:8px;background:#fff;padding:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sel{appearance:none;height:34px;border:1px solid #dde6f2;border-radius:8px;background:#fff;padding:0 28px 0 10px;font:500 13px var(--font-ui);color:#0f172a;display:inline-flex;align-items:center;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 8 10 12 14 8'/></svg>");background-repeat:no-repeat;background-position:right 9px center}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font:500 12px var(--font-ui)}
.btn svg{width:14px;height:14px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn--p{background:#0f9fb8;color:#fff}.btn--p svg{stroke:#fff}
.btn--o{background:#fff;color:#0f172a;border:1px solid #dde6f2}.btn--o svg{stroke:#0f172a}
.fi{width:16px;height:16px;stroke:#64748b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body style="padding:0">
<div class="bar">
  <svg class="fi" viewBox="0 0 24 24"><path d="M3 5h18"/><path d="M6 12h12"/><path d="M10 19h4"/></svg>
  <span class="sel">All sources</span>
  <span class="sel">All statuses</span>
  <span class="sel" style="min-width:150px">All event types</span>
  <span class="sel" style="color:#64748b">From · Pick date</span>
  <div style="margin-left:auto;display:flex;gap:8px">
    <button class="btn btn--p"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>Apply</button>
    <button class="btn btn--o"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.64-6.36"/><path d="M3 4v5h5"/></svg>Reset</button>
  </div>
</div>
<p class="caption" style="margin-top:14px;padding:0 2px">Structured filter controls — source / status / eventType / time window — with explicit Apply + Reset. Never a freeform query box.</p>
</body></html>
