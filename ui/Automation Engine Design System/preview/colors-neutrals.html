<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="grid" style="grid-template-columns:repeat(6,1fr)">
  <div class="swatch"><div class="chip" style="background:#f7f9fc"></div><div class="name">bg</div><div class="hex">#f7f9fc</div></div>
  <div class="swatch"><div class="chip" style="background:#ffffff"></div><div class="name">surface</div><div class="hex">#ffffff</div></div>
  <div class="swatch"><div class="chip" style="background:#fbfdff"></div><div class="name">surface-alt</div><div class="hex">#fbfdff</div></div>
  <div class="swatch"><div class="chip" style="background:#dde6f2"></div><div class="name">border</div><div class="hex">#dde6f2</div></div>
  <div class="swatch"><div class="chip" style="background:#0f172a"></div><div class="name" style="color:#0f172a">text</div><div class="hex">#0f172a</div></div>
  <div class="swatch"><div class="chip" style="background:#64748b"></div><div class="name">text-muted</div><div class="hex">#64748b</div></div>
</div>
<p class="caption" style="margin-top:16px">Neutral base — slate ramp on a cool off-white app background. Borders are hairline, never heavy.</p>
</body></html>
